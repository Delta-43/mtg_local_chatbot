networks:
  mtg-network:
    driver: bridge

services:
  mtg-judge:
    build: .
    container_name: mtg-judge-chatbot
    volumes:
      - ./project_config.yml:/app/project_config.yml:ro
      - ./data/conversations:/app/data/conversations
    environment:
      - PROJECT_CONFIG_FILE=/app/project_config.yml
      - CONVERSATION_DB_PATH=/app/data/conversations/conversations.db
      # A dedicated Ollama instance on the host (see scripts/run_ollama.sh),
      # not any system-wide service -- see that script for why. Only used when
      # LLM_PROVIDER=local (which includes Ollama cloud models -- inference
      # happens on Ollama's infrastructure, but the client still talks to this
      # local instance); ignored in hosted (OpenRouter) mode.
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RULES_MCP_URL=http://rules-mcp:8100/mcp
      - SCRYFALL_MCP_URL=http://scryfall-mcp:3000/mcp
      - SEARXNG_URL=http://searxng:8080
      - SCRYFALL_USER_AGENT=${SCRYFALL_USER_AGENT:-MTG-Judge-Chatbot/1.0 (+https://github.com/mtg-judge)}
      - API_KEYS=${API_KEYS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Documented in README as env-overridable, but docker-compose only
      # forwards vars explicitly listed here -- without these three, .env
      # silently had no effect on a docker-compose deployment and only
      # project_config.yml's values ever applied.
      #
      # Unlike the string/list vars above, these three are int-cast by
      # core_config/settings.py's _resolve() -- an *empty* env var (not an
      # absent one) still short-circuits straight to _coerce("", int), which
      # raises ValueError and crashes config loading at import time. So,
      # unlike CORS_ALLOWED_ORIGINS/API_KEYS's `:-` (empty is fine, parses to
      # []), these need a real numeric fallback baked in, matching
      # core_config's own hardcoded defaults exactly.
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-20}
      - DAILY_QUOTA_ANONYMOUS=${DAILY_QUOTA_ANONYMOUS:-30}
      - DAILY_QUOTA_AUTHENTICATED=${DAILY_QUOTA_AUTHENTICATED:-500}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rules-mcp
      - scryfall-mcp
      - searxng
    networks:
      - mtg-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  rules-mcp:
    build: ./rules_mcp
    container_name: mtg-rules-mcp
    ports:
      # Loopback-only: lets a host-run backend (run_bot.sh) reach it directly
      # without publishing it to the network. Only caddy is meant to be public.
      - "127.0.0.1:8100:8100"
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/pdf_parser:/app/data/pdf_parser
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8100
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PDF_PARSER_DIR=/app/data/pdf_parser
      - REFRESH_ON_BOOT=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mtg-network
    restart: unless-stopped

  scryfall-mcp:
    build:
      context: ./vendor/scryfall-mcp
      dockerfile: ../scryfall-mcp.Dockerfile
    container_name: mtg-scryfall-mcp
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=3000
      - SCRYFALL_USER_AGENT=${SCRYFALL_USER_AGENT:-MTG-Judge-Chatbot/1.0 (+https://github.com/mtg-judge)}
    networks:
      - mtg-network
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: mtg-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - mtg-network
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin deploy (default): Caddy serves the built PWA and
        # proxies /chat*, /health on the same domain, so the API base is
        # relative. Override if the frontend is ever split onto a
        # different origin than the backend.
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: mtg-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mtg-judge
    networks:
      - mtg-network
    restart: unless-stopped

  # Opt-in: `docker-compose --profile tunnel up`. Connects this deployment to
  # a Cloudflare Tunnel so it's reachable at your domain (e.g.
  # oracle.delta43.net) with TLS terminated at Cloudflare's edge -- no public
  # port needs to be open on the host at all. Create the tunnel in the
  # Cloudflare Zero Trust dashboard, point its public hostname at
  # `http://localhost:80` (host networking, see below -- matches this
  # deployment's other cloudflared tunnels), and put the tunnel's token in
  # CLOUDFLARE_TUNNEL_TOKEN.
  #
  # Pinned by digest + host networking + pull_policy: always to match this
  # host's other cloudflared tunnels (~/.docker_configs/cloudflared/compose.yml)
  # -- one cloudflared version across every tunnel on the box. Unlike those,
  # the token here is an env var, not inlined in the command: this file is
  # published on GitHub, theirs isn't.
  cloudflared:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: cf-oracle-tunnel
    network_mode: host
    pull_policy: always
    # Not `:?`-required: compose interpolates every service's command/env at
    # parse time regardless of active --profile flags (see the r2-backup
    # service below), so a hard requirement here would break plain
    # `docker-compose up` for everyone not using the tunnel profile.
    # cloudflared fails fast with its own clear error if this is empty.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped
    profiles:
      - tunnel

  # Opt-in: `docker-compose --profile backup up`. Periodically snapshots
  # conversation memory + the rules ChromaDB index to Cloudflare R2 (an
  # S3-compatible bucket) so state survives a VPS rebuild/redeploy. No-ops
  # (logs and exits) if R2_* credentials aren't set -- see scripts/backup_to_r2.py.
  r2-backup:
    build: .
    container_name: mtg-r2-backup
    command: python -m scripts.backup_to_r2 --loop
    volumes:
      - ./data/conversations:/app/data/conversations:ro
      - ./data/chroma:/app/data/chroma:ro
    environment:
      # Not `:?`-required (see the `tunnel` service's comment above) --
      # scripts/backup_to_r2.py already no-ops with a clear log line if these
      # are unset, which is the right place to enforce this, not compose-parse
      # time.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_BACKUP_INTERVAL_SECONDS=${R2_BACKUP_INTERVAL_SECONDS:-3600}
    networks:
      - mtg-network
    restart: unless-stopped
    profiles:
      - backup

volumes:
  caddy_data:
  caddy_config:
